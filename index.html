<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Data Dashboard with Total</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .table-container { box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); border-radius: 12px; overflow: hidden; background: white; }
        tbody tr { transition: all 0.2s ease; }
        tbody tr:hover { background-color: #f1f5f9 !important; }
        #imageModal { backdrop-filter: blur(4px); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="wallet" class="text-blue-600"></i>
                    ระบบสรุปรายการชำระค่างวด
                </h1>
                <p class="text-slate-500">จัดการข้อมูลอัตโนมัติ</p>
            </div>
            <div id="status" class="flex items-center gap-2 text-sm text-green-600 bg-green-50 px-4 py-2 rounded-full border border-green-100">
                <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                อัปเดตข้อมูลล่าสุดเรียบร้อย
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
            <p class="text-slate-500">กำลังประมวลผลข้อมูล...</p>
        </div>

        <!-- Table Display -->
        <div id="table-wrapper" class="table-container hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-800 text-white border-b border-slate-700">
                        <tr>
                            <th class="px-6 py-4 text-sm font-medium uppercase tracking-wider">No.</th>
                            <th class="px-6 py-4 text-sm font-medium uppercase tracking-wider">Date</th>
                            <th class="px-6 py-4 text-sm font-medium uppercase tracking-wider">Item</th>
                            <th class="px-6 py-4 text-sm font-medium uppercase tracking-wider text-right">Amount</th>
                            <th class="px-6 py-4 text-sm font-medium uppercase tracking-wider">Remark</th>
                            <th class="px-6 py-4 text-sm font-medium uppercase tracking-wider text-center">Slip</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100 text-slate-700">
                        <!-- Data rows will be inserted here -->
                    </tbody>
                    <tfoot id="table-footer" class="bg-blue-50 border-t-2 border-blue-200">
                        <!-- Total row will be inserted here -->
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal for Slip Display -->
    <div id="imageModal" class="fixed inset-0 bg-black/70 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full relative overflow-hidden shadow-2xl animate-in zoom-in duration-300">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="file-text" class="text-blue-600"></i>
                    หลักฐานการชำระเงิน
                </h3>
                <button onclick="closeModal()" class="p-2 hover:bg-slate-100 rounded-full transition-colors">
                    <i data-lucide="x" class="w-6 h-6 text-slate-500"></i>
                </button>
            </div>
            <div class="p-4 bg-slate-50 flex justify-center items-center min-h-[300px]">
                <img id="modalImage" src="" alt="Slip" class="max-w-full max-h-[70vh] rounded shadow-lg object-contain">
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/1wzAjxRRoov1e5LUlyqIhs5AQ_jfnMDPjRGndg6QvI6Q/export?format=csv';

        async function fetchData() {
            try {
                const response = await fetch(CSV_URL);
                const csvData = await response.text();
                
                Papa.parse(csvData, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        renderTable(results.data);
                    },
                    error: function(err) {
                        console.error("Error parsing CSV:", err);
                    }
                });
            } catch (error) {
                console.error("Fetch error:", error);
                document.getElementById('loading').innerHTML = `<p class="text-red-500 font-bold">ไม่สามารถดึงข้อมูลได้ กรุณาลองใหม่อีกครั้ง</p>`;
            }
        }

        function renderTable(data) {
            const tableBody = document.getElementById('table-body');
            const tableFooter = document.getElementById('table-footer');
            const loading = document.getElementById('loading');
            const tableWrapper = document.getElementById('table-wrapper');
            
            tableBody.innerHTML = '';
            let totalAmount = 0;

            data.forEach((row, index) => {
                // คำนวณยอดรวม (ล้างค่า comma ออกถ้ามี)
                const amount = parseFloat(String(row.Amount).replace(/,/g, '')) || 0;
                totalAmount += amount;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-6 py-4 text-sm text-slate-400 font-mono">${index + 1}</td>
                    <td class="px-6 py-4 text-sm font-medium text-slate-700">${row.Date || '-'}</td>
                    <td class="px-6 py-4 text-sm text-slate-600">${row.Item || '-'}</td>
                    <td class="px-6 py-4 text-sm text-slate-800 text-right font-semibold">${amount.toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                    <td class="px-6 py-4 text-sm text-slate-500 italic text-sm">${row.Remark || '-'}</td>
                    <td class="px-6 py-4 text-sm text-center">
                        ${row.Slip ? `
                            <button onclick="openModal('${row.Slip}')" class="p-2 text-blue-600 hover:bg-blue-100 rounded-full transition-all hover:scale-110 active:scale-95 shadow-sm">
                                <i data-lucide="file-text" class="w-5 h-5"></i>
                            </button>
                        ` : '<span class="text-slate-300">-</span>'}
                    </td>
                `;
                tableBody.appendChild(tr);
            });

            // สร้างแถวสรุปยอดรวม (Footer)
            tableFooter.innerHTML = `
                <tr class="font-bold text-slate-800">
                    <td colspan="3" class="px-6 py-5 text-right text-base">ยอดรวมทั้งสิ้น (Total Amount):</td>
                    <td class="px-6 py-5 text-right text-lg text-blue-700 underline decoration-double decoration-blue-200">
                        ${totalAmount.toLocaleString(undefined, {minimumFractionDigits: 2})}
                    </td>
                    <td colspan="2" class="px-6 py-5 text-slate-400 font-normal text-xs text-center uppercase tracking-widest">Calculated Successfully</td>
                </tr>
            `;

            lucide.createIcons();
            loading.classList.add('hidden');
            tableWrapper.classList.remove('hidden');
        }

        function openModal(url) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImage');
            modalImg.src = url;
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('imageModal');
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(event) {
            if (event.target == document.getElementById('imageModal')) closeModal();
        }

        fetchData();
        lucide.createIcons();
    </script>
</body>
</html>
